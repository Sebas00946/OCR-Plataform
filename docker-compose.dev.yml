version: '3.8'

# Configuración para desarrollo usando la base de datos veritask_manager existente
# Uso: docker-compose -f docker-compose.dev.yml up

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/veritask_manager
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - API_KEY_ENABLED=False
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/veritask_manager
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=True
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./temp:/app/temp
      - ./logs:/app/logs
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A src.infrastructure.tasks.celery_app worker --loglevel=info --concurrency=2
